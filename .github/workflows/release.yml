name: release

# Publishes Pingify.sh. That single file is the whole product: the manager,
# the engine's sources and the vendored modules, and it builds the engine on
# the server it lands on. There is no prebuilt binary to ship, because the
# manager deliberately has no path that would download one.
#
# The engine's sources are not a second copy in this repository. They are in
# the script, so this workflow takes them out of it and tests those - which
# also proves that what a server would extract and compile is what passed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The script must parse before anything is taken out of it
        run: bash -n Pingify.sh

      - name: Take the engine out of the script
        run: |
          PINGIFY_NO_MAIN=1 bash -c 'set -e; . ./Pingify.sh; write_core_sources .'
          test -f go.mod && test -d internal && test -d vendor
          echo "extracted $(find cmd internal -name '*.go' | wc -l) Go files"

      # From go.mod, not a number typed here - and so after the step that
      # takes go.mod out of the script. go.mod is gitignored like the rest of
      # the engine, and a setup-go that ran first failed on a checkout that
      # had none, before anything was tested: the first run of this workflow.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # The script carries every Go file except the tests, which would only be
      # weight on a server that is never going to run them. They are in the
      # repository instead, and go over the extracted tree here - so what is
      # tested is exactly what a server extracts and compiles.
      - name: Lay the engine's tests over it
        run: |
          cp -r tests/_engine/internal tests/_engine/cmd . 2>/dev/null || true
          n=$(find cmd internal -name '*_test.go' | wc -l)
          [ "$n" -gt 0 ] || { echo "no engine tests were laid down"; exit 1; }
          echo "$n test files"

      # The race detector needs cgo, which is why this runs here rather than
      # on the machine the script was written on.
      - name: Test the engine
        run: |
          set -o pipefail
          go test -count=1 -race -timeout 300s ./... 2>&1 | tee /tmp/engine-test.log

      # These drive the manager's own functions in a sandbox, so a wizard that
      # stops producing a config the engine accepts fails the release rather
      # than reaching a server.
      - name: Test the manager
        run: |
          set -o pipefail
          bash tests/run.sh 2>&1 | tee /tmp/manager-test.log

      # A failure said only "exit code 1" to anyone who could not open the
      # log, and the first run of this check failed in a way nobody could
      # read. The lines that say what failed go up as an annotation, which
      # the checks page and the API show to anybody.
      - name: Say what failed
        if: failure()
        run: |
          for f in /tmp/engine-test.log /tmp/manager-test.log; do
            [ -s "$f" ] || continue
            sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' "$f" |
              grep -nE -- '--- FAIL|^FAIL|^panic|WARNING: DATA RACE|_test\.go:[0-9]+:|^      .+\.go:[0-9]+|^    x |wanted:|got:|looked for' |
              head -n 60 > /tmp/why.txt || true
            [ -s /tmp/why.txt ] || tail -n 40 "$f" > /tmp/why.txt
            msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' /tmp/why.txt | awk '{ printf "%s%%0A", $0 }')
            echo "::error title=$(basename "$f" .log)::$msg"
          done

      - name: It must still compile for both architectures, offline
        run: |
          for arch in amd64 arm64; do
            GOPROXY=off GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/pingify
          done

      - name: The tag and the script must agree
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          have="$(grep -m1 '^PINGIFY_VERSION=' Pingify.sh | cut -d'"' -f2)"
          if [ "$tag" != "$have" ]; then
            echo "tag v$tag but the script says $have - one of them is wrong"
            exit 1
          fi

      - name: Write the release notes
        env:
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          The manager and the engine in one file.

          Install or update, on both servers:

          ```bash
          wget -O Pingify.sh https://github.com/OWNER_REPO/releases/latest/download/Pingify.sh && bash Pingify.sh
          ```

          The engine is compiled on the server from the sources inside the
          script, so no server has to reach a Go proxy to install it.
          NOTES
          sed -i "s#OWNER_REPO#${REPO}#" notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            tag="v$(grep -m1 '^PINGIFY_VERSION=' Pingify.sh | cut -d'"' -f2)"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Pingify.sh --clobber
          else
            gh release create "$tag" Pingify.sh \
              --title "Pingify $tag" --notes-file notes.md
          fi

      # To a server in Iran dl.google.com answers every request with a 404,
      # so the Go the script asks for rides along with the release, which that
      # server can reach. It is fetched from go.dev here and must match the
      # sha256 the script carries - the same check a server makes before it
      # unpacks the file - or the release stops.
      - name: Carry the Go toolchain the script asks for
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            tag="v$(grep -m1 '^PINGIFY_VERSION=' Pingify.sh | cut -d'"' -f2)"
          fi
          for arch in amd64 arm64; do
            name=$(PINGIFY_NO_MAIN=1 bash -c '. ./Pingify.sh; go_tarball "$1"' _ "$arch")
            want=$(PINGIFY_NO_MAIN=1 bash -c '. ./Pingify.sh; go_sum "$1"' _ "$name") || {
              echo "::error::the script carries no sha256 for $name"; exit 1; }
            curl -fsSL --retry 3 -o "$name" "https://go.dev/dl/$name"
            got=$(sha256sum "$name" | cut -c1-64)
            if [ "$got" != "$want" ]; then
              echo "::error::$name from go.dev is $got, the script expects $want"
              exit 1
            fi
            gh release upload "$tag" "$name" --clobber
          done
