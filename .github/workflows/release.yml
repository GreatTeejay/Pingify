name: release

# Publishes Pingify.sh. That single file is the whole product: it carries the
# manager, the engine's sources and the vendored modules, and builds the engine
# on the server it lands on. There is no prebuilt binary to ship, because the
# manager deliberately has no path that would download one.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      # The race detector needs cgo, which is why this runs here rather than
      # on the machine the script was written on.
      - name: Test the engine
        run: go test -count=1 -race -timeout 300s ./...

      # These drive the manager's own functions in a sandbox, so a wizard that
      # stops producing a config the engine accepts fails the release rather
      # than reaching a server.
      - name: Test the manager
        run: bash tests/run.sh

      # build.sh checks gofmt and go vet, refuses a script that does not parse,
      # extracts the embedded sources again and compares them byte for byte,
      # and proves the result still compiles offline for both architectures.
      - name: Build and verify the bundled script
        run: bash build.sh

      - name: The tag and the script must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          have="$(grep -m1 '^PINGIFY_VERSION=' Pingify.sh | cut -d'"' -f2)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$have" ]; then
            echo "tag v$tag but the script says $have - one of them is wrong"
            exit 1
          fi

      - name: Write the release notes
        env:
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          The manager and the engine in one file.

          Install or update, on both servers:

          ```bash
          bash <(wget -qO- https://github.com/OWNER_REPO/releases/latest/download/Pingify.sh)
          ```

          The engine is compiled on the server from the sources inside the
          script, so no server has to reach a Go proxy to install it.
          NOTES
          sed -i "s#OWNER_REPO#${REPO}#" notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            tag="v$(grep -m1 '^PINGIFY_VERSION=' Pingify.sh | cut -d'"' -f2)"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Pingify.sh --clobber
          else
            gh release create "$tag" Pingify.sh \
              --title "Pingify $tag" --notes-file notes.md
          fi
