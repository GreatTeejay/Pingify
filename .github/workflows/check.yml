name: check

# The same tests the release runs, run on every push and every pull request.
#
# Before this, nothing was tested until a tag was pushed - and a tag is public
# the moment it exists, so the first thing that told anybody the build was
# broken was a broken release. This workflow is the release's own steps with
# the publishing taken off the end, in two jobs that run beside each other.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # What a server extracts and compiles, tested as the server would get it.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The script must parse before anything is taken out of it
        run: bash -n Pingify.sh

      - name: Take the engine out of the script
        run: |
          PINGIFY_NO_MAIN=1 bash -c 'set -e; . ./Pingify.sh; write_core_sources .'
          test -f go.mod && test -d internal && test -d vendor

      # From go.mod, not a number typed here - and so after the step that
      # takes go.mod out of the script. go.mod is gitignored like the rest of
      # the engine, and a setup-go that ran first failed on a checkout that
      # had none, before anything was tested: the first run of this workflow.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Lay the engine's tests over it
        run: |
          cp -r tests/_engine/internal tests/_engine/cmd . 2>/dev/null || true
          n=$(find cmd internal -name '*_test.go' | wc -l)
          [ "$n" -gt 0 ] || { echo "no engine tests were laid down"; exit 1; }
          echo "$n test files"

      - name: Test the engine
        run: go test -count=1 -race -timeout 300s ./...

      - name: Test the manager
        run: bash tests/run.sh

      - name: It must still compile for both architectures, offline
        run: |
          for arch in amd64 arm64; do
            GOPROXY=off GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/pingify
          done

  # Pingify.sh is the product and it is built from parts/ by hand, so a commit
  # that changes a part without rebuilding ships the old manager - which
  # nobody notices until a server has it. The build is deterministic, so the
  # committed file and a fresh build are compared byte for byte.
  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The engine's sources are gitignored - Pingify.sh is the only copy in
      # the repository - so a bare checkout has no cmd/, internal/ or go.mod.
      # They are taken back out of the committed script first, with the tests
      # laid over them, exactly as the release does.
      - name: Take the engine out of the script
        run: |
          PINGIFY_NO_MAIN=1 bash -c 'set -e; . ./Pingify.sh; write_core_sources .'
          cp -r tests/_engine/internal tests/_engine/cmd . 2>/dev/null || true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Two files carry the version by hand and both must say the same
        run: |
          a="$(grep -m1 '^PINGIFY_VERSION=' parts/00-ui.sh | cut -d'"' -f2)"
          b="$(grep -m1 '^const version = ' cmd/pingify/main.go | cut -d'"' -f2)"
          [ "$a" = "$b" ] || { echo "manager $a, engine $b"; exit 1; }
          echo "both say $a"

      # What this proves is that the shell half of Pingify.sh matches parts/,
      # the half a person edits by hand and the one that gets committed
      # without a rebuild. The engine in it cannot be checked this way: here
      # it was taken out of the committed script a step ago, so rebuilding
      # puts back what was there. The vendored modules are left out of the
      # comparison for a second reason - they go in as a tar and gzip stream,
      # which records file owners and directory order, and those are not the
      # same on the machine that built the script and on this one. The
      # comparison of the whole file failed on its first run for that alone.
      - name: The committed script must be what parts/ builds
        run: |
          cp Pingify.sh /tmp/committed.sh
          bash build.sh >/dev/null
          mask() {
            awk '/^    base64 -d <<.PINGIFY_GO_SOURCE_EOF. \| tar / { print "    [the vendored modules]"; skip = 1; next }
                 skip && $0 == "PINGIFY_GO_SOURCE_EOF" { skip = 0; next }
                 !skip' "$1"
          }
          mask /tmp/committed.sh > /tmp/committed.masked
          mask Pingify.sh > /tmp/rebuilt.masked
          grep -q '^    \[the vendored modules\]$' /tmp/committed.masked ||
            { echo "the vendored modules were not found in the script"; exit 1; }
          if ! cmp -s /tmp/committed.masked /tmp/rebuilt.masked; then
            echo "Pingify.sh is not what parts/ builds - run build.sh and commit the result"
            diff /tmp/committed.masked /tmp/rebuilt.masked | head -40
            exit 1
          fi
          echo "the committed script is what parts/ builds, the vendored modules aside"
